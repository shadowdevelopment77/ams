name: Reset demo data

on:
  # Schedule disabled until this is actually deployed -- there's no BACKEND_URL
  # yet, so every scheduled run just fails and emails a failure notice.
  # Re-add once deployed:
  #   schedule:
  #     - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset-demo endpoint
        run: |
          curl -sS -X POST "${{ secrets.BACKEND_URL }}/api/admin/reset-demo" \
            -H "Authorization: Bearer ${{ secrets.RESET_DEMO_SECRET }}" \
            --fail-with-body
