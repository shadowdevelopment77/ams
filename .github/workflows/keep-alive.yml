name: Keep backend warm

on:
  # Schedule disabled until this is actually deployed -- there's no BACKEND_URL
  # yet, so every scheduled run just fails and emails a failure notice.
  # Re-add once deployed:
  #   schedule:
  #     - cron: '*/10 * * * *'  # every ~10 minutes
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -sS "${{ secrets.BACKEND_URL }}/health" --fail-with-body
